<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIPER</title>
    <link rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>
    <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>
    <script src="swiper.js"></script>
    <link rel="stylesheet" href="swiper.css">
</head>
<body>
<div class="swiper">
  <div class="swiper-wrapper">
    <div class="swiper-slide"><img class="swiper-img" src="../../images/swiper/img1.jpg" alt="img1"></div>
    <div class="swiper-slide"><img class="swiper-img" src="../../images/swiper/img2.jpg" alt="img2"></div>
    <div class="swiper-slide"><img class="swiper-img" src="../../images/swiper/img3.jpg" alt="img3"></div>
  </div>
  <div class="swiper-pagination"></div>

  <div class="swiper-button-prev"></div>
  <div class="swiper-button-next"></div>

  <div class="swiper-scrollbar"></div>
</div>
</body>
</html>
